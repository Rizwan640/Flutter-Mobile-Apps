name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android and iOS platform folders
        run: flutter create --platforms=android,ios --project-name flutter_mobile_apps .

      - name: Configure Android for local model downloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle_kts = Path('android/app/build.gradle.kts')
          gradle_groovy = Path('android/app/build.gradle')
          gradle = gradle_kts if gradle_kts.exists() else gradle_groovy
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26')
          gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\\n'
          if 'android.permission.INTERNET' not in xml:
              xml = xml.replace('<manifest ', '<manifest ', 1)
              insert_at = xml.find('>') + 1
              xml = xml[:insert_at] + '\\n' + permission + xml[insert_at:]
          manifest.write_text(xml)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-mobile-apps-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
